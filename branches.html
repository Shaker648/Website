<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فروعنا ومواقعنا | فيرست 1 كار</title>
<meta name="description" content="عناوين فروع فيرست 1 كار وأرقام التليفونات ومواعيد العمل، مع الموقع على خرائط جوجل.">
<meta name="theme-color" content="#020617">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-orb g"></div>
<div class="bg-orb v"></div>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="shell">
      <span class="eyebrow" data-en="Find us">تعالى لنا</span>
      <h1 class="grad" data-en="Our showrooms">فروعنا</h1>
      <p class="lead" data-en="Five showrooms open daily from 10 AM to 11 PM, with a sixth on the way. Tap any branch to open it in Google Maps.">
        خمس صالات عرض فاتحة يومياً من ١٠ صباحاً لـ ١١ مساءً، وفرع سادس في الطريق.
        اضغط على أي فرع يفتح لك على خرائط جوجل على طول.
      </p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="shell">
      <div class="grid grid-2" id="branch-grid"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="shell">
      <div class="cta-band reveal">
        <h2 data-en="Coming from far away?">جاي من بعيد؟</h2>
        <p class="lead" data-en="Message us before you travel and we will confirm the car you want is on the floor, ready for you to see.">
          كلمنا قبل ما تتحرك، وهنأكد لك إن العربية اللي عايزها موجودة في المعرض ومستنياك.
        </p>
        <div class="hero-cta">
          <a class="btn btn-primary js-wa" href="#" target="_blank" rel="noopener" data-en="Confirm on WhatsApp">أكّد على واتساب</a>
          <a class="btn btn-ghost js-tel" href="#" data-en="Call us">اتصل بينا</a>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/bg.js"></script>
<script>
(function () {
  var grid = document.getElementById('branch-grid');
  var esc  = window.esc;

  function render() {
    var lang = window.currentLang();
    var hrs  = window.tr(SITE.contact.hours);

    grid.innerHTML = SITE.branches.map(function (b) {
      /* ── a branch that has not opened yet ── */
      if (b.comingSoon) {
        return '' +
          '<article class="card branch-card soon reveal in">' +
            '<div class="branch-map">' +
              '<span class="soon-tag">' + (lang === 'ar' ? 'قريباً' : 'Opening soon') + '</span>' +
              '<div class="pin">🚧</div>' +
            '</div>' +
            '<div class="branch-body">' +
              '<h3>' + esc(window.tr(b.name)) + '</h3>' +
              '<div class="branch-row"><span>🗺️</span><span>' +
                esc(window.tr(b.address)) + '</span></div>' +
              '<div class="branch-row"><span>📅</span><span>' +
                (lang === 'ar'
                  ? 'الفرع بيتجهز دلوقتي — تابعنا عشان تعرف ميعاد الافتتاح.'
                  : 'This showroom is being fitted out — follow us for the opening date.') +
              '</span></div>' +
              '<div class="branch-actions">' +
                '<a class="btn btn-ghost" href="' + esc(SITE.social.facebook) + '" ' +
                   'target="_blank" rel="noopener">' +
                  (lang === 'ar' ? 'تابعنا للافتتاح' : 'Follow for the opening') + '</a>' +
              '</div>' +
            '</div>' +
          '</article>';
      }

      /* ── an open showroom ── */
      var phoneRows = b.phones.map(function (n) {
        return '<div class="branch-row"><span>📞</span>' +
               '<a class="num" href="tel:' + esc(n) + '">' + esc(n) + '</a></div>';
      }).join('');

      return '' +
        '<article class="card branch-card reveal in">' +
          '<div class="branch-map">' +
            (b.main ? '<span class="main-tag">' +
              (lang === 'ar' ? 'الفرع الرئيسي' : 'Main branch') + '</span>' : '') +
            '<div class="pin">📍</div>' +
          '</div>' +
          '<div class="branch-body">' +
            '<h3>' + esc(window.tr(b.name)) + '</h3>' +
            '<div class="branch-row"><span>🗺️</span><span>' +
              esc(window.tr(b.address)) + '</span></div>' +
            phoneRows +
            '<div class="branch-row"><span>🕒</span><span>' + esc(hrs) + '</span></div>' +
            '<div class="branch-actions">' +
              '<a class="btn btn-primary" href="' + esc(b.mapUrl) + '" ' +
                 'target="_blank" rel="noopener">' +
                (lang === 'ar' ? 'افتح على الخريطة' : 'Open in Maps') + '</a>' +
              '<a class="btn btn-ghost" href="tel:' + esc(b.phones[0]) + '">' +
                (lang === 'ar' ? 'اتصل بالفرع' : 'Call branch') + '</a>' +
            '</div>' +
          '</div>' +
        '</article>';
    }).join('');
  }

  document.addEventListener('langchange', render);
  render();
})();
</script>
</body>
</html>
